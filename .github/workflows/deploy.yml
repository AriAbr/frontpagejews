# Fetches any GDELT day not yet fetched, builds the static site and deploys it
# to Netlify. Runs daily, on every push to main (so code changes go live), and by
# hand from the Actions tab.
name: Deploy
on:
  schedule:
    # GDELT's last file for a day lands shortly after midnight UTC.
    - cron: "30 1 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  POETRY_VERSION: 1.8.2
  PYTHON_VERSION: "3.12"
  # manage.py needs a key to boot; nothing here is secret.
  SECRET_KEY: "insecurekey"
  # Print each day's line as it finishes, rather than buffered to the end.
  PYTHONUNBUFFERED: "1"
  # Reports errors in the fetches, and the built page's, to Sentry. Not secret,
  # since it's in every page's source, but a repository variable rather than
  # written here, so a fork's deploys don't report to this project.
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Normally one new day. Room for a few hundred missing ones, at about 12
    # seconds each.
    timeout-minutes: 300
    # To push the new GDELT days and benchmarks to the data branch.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install python dependencies
        run: poetry install --no-interaction
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

      # Every GDELT day fetched so far, one JSON file each, and the benchmarks,
      # kept on a branch of their own that holds only data. Each run fetches any
      # day missing from it and pushes the new ones back, so the history stays
      # complete by itself. Changing how days are counted means refetching them all with
      # --refresh, once, and pushing the result.
      - name: Check out data
        uses: actions/checkout@v4
        with:
          ref: data
          path: var/data

      # From GDELT 2's first full day, so a day missed for any reason is
      # filled in; days already fetched are skipped in a moment.
      - name: Fetch GDELT
        run: poetry run python manage.py fetch_gdelt --start 2015-02-19

      # Saved even if a later step fails, so no fetched day is lost.
      - name: Push new GDELT days
        if: always()
        working-directory: var/data
        run: |
          git add gdelt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: Add $(git diff --cached --name-only | wc -l) GDELT days"
          # In case days were pushed from elsewhere meanwhile; each day is its own file.
          git pull --quiet --rebase
          git push

      # Refetched every run, though they change monthly at most; if the fetch
      # fails, keep the last copies.
      - name: Fetch benchmarks
        run: >-
          poetry run python manage.py fetch_benchmarks
          || (test -f var/data/benchmarks/population_history.json
          && test -f var/data/benchmarks/gdp_history.json
          && test -f var/data/benchmarks/conflict_deaths_history.json)

      - name: Push benchmarks
        working-directory: var/data
        run: |
          # Don't commit a .tmp left by a fetch that failed mid-write.
          git add benchmarks/*_history.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "chore: Update benchmarks"
          git pull --quiet --rebase
          git push

      - name: Build site
        run: poetry run python manage.py build_site
        env:
          # A repository variable, like SENTRY_DSN, so a fork's site doesn't
          # count its visits here.
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.8.1 deploy --dir=build --prod --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
