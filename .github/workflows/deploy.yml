# Fetches the newest GDELT day, builds the static site and deploys it to
# Netlify. Runs daily, on every push to main (so code changes go live), and by
# hand from the Actions tab.
name: Deploy
on:
  schedule:
    # GDELT's last file for a day lands shortly after midnight UTC.
    - cron: "30 1 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time; a newer one waits rather than racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  POETRY_VERSION: 1.8.2
  PYTHON_VERSION: "3.12"
  # manage.py needs a key to boot; nothing here is secret.
  SECRET_KEY: "insecurekey"
  # Print each day's line as it finishes, rather than buffered to the end.
  PYTHONUNBUFFERED: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The first run backfills 30 days, a few minutes each.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install python dependencies
        run: poetry install --no-interaction
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'

      # The data cache (var/) lives in the Actions cache, not the repo. Each run
      # restores the newest copy and saves a new one, so only missing days are
      # downloaded. If it is ever evicted, the next run just backfills again.
      # Changing how days are counted means changing the prefix (here and in
      # "Save data cache"), so the next run starts empty and refetches them all.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: var
          key: data-v2-${{ github.run_id }}
          restore-keys: data-v2-

      - name: Fetch GDELT
        run: poetry run python manage.py fetch_gdelt

      # The benchmarks change monthly at most; if the fetch fails, keep the last copies.
      - name: Fetch benchmarks
        run: >-
          poetry run python manage.py fetch_benchmarks
          || (test -f var/benchmarks/population.json && test -f var/benchmarks/gdp.json
          && test -f var/benchmarks/conflict_deaths.json)

      # Saved even if a later step fails, so a long backfill is never lost.
      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: var
          key: data-v2-${{ github.run_id }}

      - name: Build site
        run: poetry run python manage.py build_site
        env:
          # Public: it's in every page's source anyway.
          GA_MEASUREMENT_ID: G-3NSLP29KBE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Netlify
        run: npx --yes netlify-cli@27.8.1 deploy --dir=build --prod --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
