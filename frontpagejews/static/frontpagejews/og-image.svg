<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The link preview: the favicon, with the site's name and subtitle
       beside it. og-image.png is drawn from this; the template says how. -->
  <rect width="1200" height="630" fill="#1c1917"/>
  <!-- The favicon's marks, copied from favicon.svg so this file shows
       whole in viewers that won't load another file. Keep the two in step.
       Its tile is left out, the same color as the background here. -->
  <svg x="65" y="189" width="275" height="275" viewBox="0 0 32 32">
    <path d="M7 25L25 7" stroke="#a8a29e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="9.5" cy="9.5" r="3.75" fill="#3b82f6"/>
    <circle cx="22.5" cy="22.5" r="3.75" fill="#d97706"/>
  </svg>
  <g font-family="Noto Sans, system-ui, sans-serif">
    <text x="383" y="290" font-size="72" font-weight="700" fill="#f5f5f4">FrontPageJews.com</text>
    <text x="385" y="362" font-size="38" fill="#a8a29e">Measuring Israel's share of the news</text>
    <text x="385" y="414" font-size="38" fill="#a8a29e">against real-world data</text>
  </g>
</svg>
